services:
  alpha-incubator-pwa-poc:
    build:
      context: .
      target: development
    ports:
      - '3000:3000'
    links:
      - 'redis:redis'
    depends_on:
      redis:
        condition: service_started
    environment:
      PORT: 3000
      NODE_ENV: development
      SESSION_COOKIE_SECURE: false
      REDIS_HOST: redis
      REDIS_TLS: false

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
